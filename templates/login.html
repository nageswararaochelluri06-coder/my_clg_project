
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div class="topbar-left">
                <a class="topbar-brand" href="{{ url_for('login') }}">Cardio Risk App</a>
            </div>
            <div class="topbar-right">
                <a class="topbar-link" href="{{ url_for('register') }}">Create account</a>
            </div>
        </div>

        <h1>Login</h1>
        <p style="text-align: center;">Sign in to use the risk assessment tool.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="post" class="auth-form">
            <div>
                <label for="identifier">Username or Email:</label>
                <input type="text" id="identifier" name="identifier" required placeholder="e.g., john or john@example.com">
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Your password">
            </div>
            <div class="form-actions">
                <button type="submit">Login</button>
            </div>
        </form>

        <p style="text-align:center; margin-top: 10px;">
            Don’t have an account? <a href="{{ url_for('register') }}">Register</a>
        </p>
    </div>
</body>
</html>
