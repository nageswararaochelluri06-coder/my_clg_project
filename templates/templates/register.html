<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div class="topbar-left">
                <a class="topbar-brand" href="{{ url_for('login') }}">Cardio Risk App</a>
            </div>
            <div class="topbar-right">
                <a class="topbar-link" href="{{ url_for('login') }}">Login</a>
            </div>
        </div>

        <h1>Create Account</h1>
        <p style="text-align: center;">Register to access the risk assessment tool.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="post" class="auth-form">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required placeholder="e.g., john_doe">
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="e.g., john@example.com">
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Minimum 6 characters">
            </div>
            <div>
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password">
            </div>
            <div class="form-actions">
                <button type="submit">Register</button>
            </div>
        </form>

        <p style="text-align:center; margin-top: 10px;">
            Already have an account? <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>
</body>
</html>
